{% extends "base.html" %}
{% block title %}Page Not Found | Urban Pulse{% endblock %}

{% block content %}
<div class="card card-elevated error-shell">
    <div class="error-code">404</div>
    <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Page Not Found</h1>
    <p style="color: var(--ink-secondary); margin-bottom: 1.5rem;">
        The Urban Pulse page you requested could not be found or may have moved.
    </p>
    <a href="{% url 'dashboard_redirect' %}" class="btn btn-primary">Return to Home</a>
</div>
{% endblock %}
